# Sample simulation composition for ./drone_mapper_simulation.
# The runs are the cartesian product: [mission_configs] x [drone_configs] x [lidar_configs].
simulation_compositions:
  simulations:
    - simulation_config:
        map_filename: data_maps/single_voxel_x2_y4_z2.npy  # 5x5x5 voxels, one occupied at (2,4,2)
        map_resolution_cm: 10.0
        initial_drone_position: {x_cm: 25, y_cm: 25, height_cm: 25}  # empty voxel (2,2,2)
        initial_angle_deg: 0
        map_axes_offset: {x_offset: 0, y_offset: 0, height_offset: 0}
      mission_configs:
        - max_steps: 5000
          gps_resolution_cm: 10
          output_mapping_resolution_factor: 1
          boundaries:                                   # covers the whole 0..50 cm map
            x_boundary: {min_cm: 0, max_cm: 50}
            y_boundary: {min_cm: 0, max_cm: 50}
            height_boundary: {min_cm: 0, max_cm: 50}
  drone_configs:
    - dimensions_cm: 10          # sphere diameter -> radius 5 cm
      max_rotate_deg: 90
      max_advance_cm: 10         # one voxel per step
      max_elevate_cm: 10
  lidar_configs:
    - z_min_cm: 5
      z_max_cm: 120
      d_cm: 2.5
      fov_circles: 5